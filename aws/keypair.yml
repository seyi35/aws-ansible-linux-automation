---
- name: Create AWS EC2 Key Pair
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    aws_region: eu-central-1
    key_name: ansible-demo-key

  tasks:

    - name: Create EC2 key pair
      amazon.aws.ec2_key:
        name: "{{ key_name }}"
        region: "{{ aws_region }}"
      register: ec2_key

      no_log: true

    - name: Save private key locally
      copy:
        content: "{{ ec2_key.key.private_key }}"
        dest: "./{{ key_name }}.pem"
        mode: "0600"
      when: ec2_key.changed
